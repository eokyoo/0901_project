<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f2"><title>새 글 쓰기 — 민준의 노트</title><link rel="stylesheet" href="css/style.css"><script src="js/main.js" defer></script></head><body><header class="site-header solid" data-header><div class="shell header-inner"><a class="wordmark" href="index.html"><span class="wordmark-dot"></span>민준의 노트</a><nav class="nav"><button class="menu-button" aria-label="메뉴 열기" aria-expanded="false" data-menu-button><span></span><span></span></button><div class="menu" data-menu><a href="index.html">홈</a><a href="posts.html">모든 글</a><a class="active" href="write.html">글쓰기</a><a class="join-link" href="signup.html">회원가입</a></div></nav><button class="theme-button" data-theme-button>◐</button></div></header><main class="write-page"><div class="shell write-layout"><aside class="write-sidebar"><p class="kicker">New story</p><h1>새 글<br>쓰기</h1><p>완벽한 문장보다 지금의 생각을 먼저 남겨보세요.</p><p class="draft-status">임시 저장은 현재 브라우저에 보관됩니다.</p></aside><section><form class="stack-form" data-draft-form><div class="field"><label for="post-title">제목</label><input id="post-title" name="title" placeholder="글의 제목을 입력하세요" required></div><div class="field"><label for="post-category">카테고리</label><select id="post-category" name="category"><option>개발</option><option>생각</option><option>일상</option></select></div><div class="field"><label for="post-summary">한 줄 소개</label><input id="post-summary" name="summary" placeholder="목록에 표시할 짧은 설명"></div><div class="field"><label for="post-content">본문</label><textarea id="post-content" name="content" placeholder="오늘 남기고 싶은 이야기를 써보세요." required></textarea></div><div class="write-actions"><button class="secondary-button" type="button" data-save-draft>임시 저장</button><button class="primary-button">글 발행하기 →</button></div></form></section></div></main><div class="toast" data-toast></div></body></html>
