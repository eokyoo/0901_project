<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f2"><title>회원가입 — 민준의 노트</title><link rel="stylesheet" href="css/style.css"><script src="js/config.js" defer></script><script src="js/main.js" defer></script><script src="js/auth.js" defer></script></head><body><header class="site-header solid"><div class="shell header-inner"><a class="wordmark" href="index.html"><span class="wordmark-dot"></span>민준의 노트</a><nav class="nav"><div class="menu"><a href="posts.html">모든 글</a><a href="login.html">로그인</a><a class="join-link active" href="signup.html">회원가입</a></div></nav><button class="theme-button" data-theme-button>◐</button></div></header><main class="form-page"><aside class="form-aside"><div><p class="eyebrow">Join the note</p><h1>읽고,<br>나누고,<br>함께 써요.</h1></div><p class="aside-quote">“좋은 기록은 혼자 시작하지만, 함께 읽을 때 더 오래 남습니다.”</p></aside><section class="form-main"><div class="form-main-inner"><h2>회원가입</h2><p class="form-description">관심 있는 글을 저장하고 새 글 소식을 받아보세요.</p><form class="stack-form" data-auth-form="signup"><div class="field"><label for="name">이름</label><input id="name" name="name" minlength="2" maxlength="30" required></div><div class="field"><label for="email">이메일</label><input id="email" name="email" type="email" required></div><div class="field"><label for="password">비밀번호</label><input id="password" name="password" type="password" minlength="8" maxlength="100" required><p class="field-help">8자 이상 입력해 주세요.</p></div><div class="field"><label for="password-confirm">비밀번호 확인</label><input id="password-confirm" name="passwordConfirm" type="password" minlength="8" required></div><label class="checkbox-field"><input type="checkbox" required><span>이용약관 및 개인정보 처리방침에 동의합니다.</span></label><p class="auth-message" role="alert" data-auth-message></p><button class="primary-button" type="submit">가입하기 →</button></form><p class="form-foot">이미 계정이 있나요? <a href="login.html">로그인</a></p></div></section></main></body></html>
