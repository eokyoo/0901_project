<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="민준의 노트 회원 프로필">
  <meta name="theme-color" content="#f7f7f2">
  <title>내 프로필 — 민준의 노트</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/auth.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">본문으로 바로가기</a>
  <header class="site-header solid" data-header>
    <div class="shell header-inner">
      <a class="wordmark" href="index.html" aria-label="민준의 노트 홈"><span class="wordmark-dot"></span>민준의 노트</a>
      <nav class="nav" aria-label="주요 메뉴">
        <button class="menu-button" type="button" aria-label="메뉴 열기" aria-expanded="false" aria-controls="main-menu" data-menu-button><span></span><span></span></button>
        <div class="menu" id="main-menu" data-menu>
          <a href="index.html">홈</a>
          <a href="posts.html">모든 글</a>
          <a href="write.html">글쓰기</a>
          <a class="join-link" href="signup.html">회원가입</a>
        </div>
      </nav>
      <button class="theme-button" type="button" aria-label="다크 모드로 전환" data-theme-button>◐</button>
    </div>
  </header>
  <main id="main-content" class="profile-page" data-profile-page>
    <div class="shell profile-layout">
      <section class="profile-intro">
        <p class="eyebrow">My account</p>
        <h1>나의<br><em>프로필.</em></h1>
        <p>민준의 노트에 로그인한 계정 정보입니다.</p>
      </section>
      <section class="profile-card" aria-labelledby="profile-heading">
        <div class="profile-avatar" aria-hidden="true"><span data-profile-field="name">회원</span></div>
        <div>
          <p class="profile-label">이름</p>
          <h2 id="profile-heading" data-profile-field="name">불러오는 중…</h2>
        </div>
        <div class="profile-detail">
          <p class="profile-label">이메일</p>
          <p data-profile-field="email">불러오는 중…</p>
        </div>
        <div class="profile-actions">
          <a class="secondary-button" href="posts.html">글 둘러보기</a>
          <a class="primary-button" href="#logout" data-logout>로그아웃</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
